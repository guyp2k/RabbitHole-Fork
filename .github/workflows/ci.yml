name: Check release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install audio test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/rh-playwright" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/rh-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check Rabbit Hole panel in real responsive player layouts
        env:
          RH_BROWSER_PLAYWRIGHT_MODULE: ${{ runner.temp }}/rh-playwright/node_modules/playwright
        run: npm run test:browser

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build source-only image
        run: docker build -t rabbit-hole:ci .
      - name: Start without access to any real Roon or LMS server
        run: >-
          docker run -d --name rabbit-hole-smoke --network none --entrypoint node
          rabbit-hole:ci -e "const RoonApi=require('node-roon-api');
          RoonApi.prototype.start_discovery=()=>{}; require('./src/server.js')"
      - name: Wait for HTTP and check persistent pairing path
        run: |
          for attempt in $(seq 1 30); do
            if docker exec rabbit-hole-smoke node -e "fetch('http://127.0.0.1:3777/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              docker exec rabbit-hole-smoke node -e "const fs=require('node:fs'); if(fs.realpathSync('/app/data')!='/app/data'||fs.readlinkSync('/app/config.json')!='data/config.json')process.exit(1); fetch('http://127.0.0.1:3777/api/status/live').then(async r=>{if(!r.ok)throw Error('HTTP '+r.status); await r.json()}).catch(e=>{console.error(e.message);process.exitCode=1})"
              exit $?
            fi
            sleep 1
          done
          docker logs rabbit-hole-smoke
          exit 1
      - name: Container diagnostics
        if: failure()
        run: docker logs rabbit-hole-smoke
      - name: Stop smoke container
        if: always()
        run: docker rm -f rabbit-hole-smoke || true
      - name: Check the entrypoint hands a root-owned data folder to PUID:PGID
        run: |
          data="$RUNNER_TEMP/unraid-data"; sudo mkdir -p "$data"; sudo chown 0:0 "$data"
          docker run -d --name rabbit-hole-puid --network none -e PUID=99 -e PGID=100 -v "$data:/app/data" \
            rabbit-hole:ci node -e "const RoonApi=require('node-roon-api'); RoonApi.prototype.start_discovery=()=>{}; require('./src/server.js')"
          for attempt in $(seq 1 30); do
            docker exec rabbit-hole-puid node -e "fetch('http://127.0.0.1:3777/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break
            sleep 1
          done
          docker exec rabbit-hole-puid sh -c 'tr "\0" " " < /proc/1/cmdline; echo; grep -E "^(Uid|Gid):" /proc/1/status' | tee ids
          grep -q "^node -e" ids
          test "$(grep -E '^(Uid|Gid):' ids | awk '{print $2}' | tr '\n' ' ')" = "99 100 "
          test "$(stat -c %u:%g "$data")" = "99:100"
          test -z "$(sudo find "$data" ! -user 99 -print -quit)"
          test -n "$(sudo find "$data" -type f -print -quit)"
          if docker run --rm --network none -e PUID=abc rabbit-hole:ci node -v 2> bad-puid; then exit 1; fi
          grep -q "PUID and PGID must be numbers" bad-puid
      - name: Stop PUID container
        if: always()
        run: docker rm -f rabbit-hole-puid || true
      - name: Check crash recovery with persistent data and live-owner exclusion
        run: bash scripts/test-docker-lock-recovery.sh rabbit-hole:ci
